apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
  namespace: default
  labels:
    app: cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-demo
  template:
    metadata:
      labels:
        app: cicd-demo
    spec:
      containers:
      - name: app
        image: cicd-demo:latest  # ← Wird von CI/CD überschrieben
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: VERSION
          value: "v1.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-demo-service
  namespace: default
spec:
  selector:
    app: cicd-demo
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP