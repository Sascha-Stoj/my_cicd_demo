name: Build and Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:  # Manuell triggern

env:
  IMAGE_NAME: cicd-demo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Code auschecken
      - name: Checkout code
        uses: actions/checkout@v3
      
      # 2. Docker Buildx setup (für multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      # 3. Docker Image bauen
      - name: Build Docker Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
          
          # Image speichern für kind
          docker save $IMAGE_NAME:$IMAGE_TAG -o /tmp/image.tar
      
      # 4. kind installieren
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      
      # 5. kubectl installieren
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      # 6. kind Cluster erstellen
      - name: Create kind cluster
        run: |
          kind create cluster --name cicd-test
          kubectl cluster-info
          kubectl get nodes
      
      # 7. Image in kind laden
      - name: Load image to kind
        run: |
          kind load docker-image $IMAGE_NAME:${{ github.sha }} --name cicd-test
      
      # 8. Deploy zu Kubernetes
      - name: Deploy to Kubernetes
        run: |
          # Image Tag in deployment setzen
          kubectl set image deployment/cicd-demo app=$IMAGE_NAME:${{ github.sha }} --record || true
          
          # Manifests anwenden
          kubectl apply -f k8s/
          
          # Warten bis Deployment ready
          kubectl rollout status deployment/cicd-demo --timeout=120s
      
      # 9. Test deployment
      - name: Test Deployment
        run: |
          kubectl get all
          kubectl get deployment cicd-demo
          
          # Port-forward im Hintergrund
          kubectl port-forward svc/cicd-demo-service 8080:80 &
          sleep 5
          
          # Test HTTP endpoint
          curl -s http://localhost:8080 || echo "Curl failed"
          
          # Logs anzeigen
          kubectl logs -l app=cicd-demo --tail=20
      
      # 10. Cleanup
      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name cicd-test
